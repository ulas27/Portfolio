<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="diamondGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="#f8f9fa"/>
  
  <!-- Ring Band -->
  <ellipse cx="150" cy="200" rx="80" ry="25" fill="url(#goldGradient)" opacity="0.9"/>
  <ellipse cx="150" cy="195" rx="75" ry="20" fill="url(#goldGradient)"/>
  
  <!-- Ring Setting -->
  <circle cx="150" cy="150" r="35" fill="url(#goldGradient)" filter="url(#glow)"/>
  <circle cx="150" cy="150" r="30" fill="url(#diamondGradient)" opacity="0.8"/>
  
  <!-- Diamond -->
  <polygon points="150,120 165,140 150,160 135,140" fill="url(#diamondGradient)" filter="url(#glow)"/>
  <polygon points="150,120 160,135 150,150 140,135" fill="#ffffff" opacity="0.9"/>
  
  <!-- Sparkles -->
  <circle cx="120" cy="120" r="2" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="130" r="1.5" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="180" r="1" fill="#ffffff" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Luxury Text -->
  <text x="150" y="250" text-anchor="middle" font-family="serif" font-size="14" fill="#666" opacity="0.7">LUXURY RING</text>
</svg>
