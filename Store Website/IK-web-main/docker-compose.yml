version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://kuyumcu:kuyumcu123@db:5432/kuyumcu_db
      - SECRET_KEY=your-production-secret-key-change-this
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USE_TLS=true
      - MAIL_USERNAME=your-email@gmail.com
      - MAIL_PASSWORD=your-app-password
      - MAIL_DEFAULT_SENDER=your-email@gmail.com
      - IYZICO_API_KEY=your-iyzico-api-key
      - IYZICO_SECRET_KEY=your-iyzico-secret-key
      - IYZICO_BASE_URL=https://api.iyzipay.com
    volumes:
      - ./static/uploads:/app/static/uploads
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - kuyumcu-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=kuyumcu_db
      - POSTGRES_USER=kuyumcu
      - POSTGRES_PASSWORD=kuyumcu123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - kuyumcu-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - kuyumcu-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./static:/app/static
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - kuyumcu-network

volumes:
  postgres_data:
  redis_data:

networks:
  kuyumcu-network:
    driver: bridge
