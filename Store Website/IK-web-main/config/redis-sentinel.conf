# Redis Sentinel Configuration for High Availability
# İnci Gold Production Setup

port 26379
sentinel deny-scripts-reconfig yes

# Master Configuration
sentinel monitor incigold-master 127.0.0.1 6379 2
sentinel auth-pass incigold-master your_redis_password_here
sentinel down-after-milliseconds incigold-master 30000
sentinel parallel-syncs incigold-master 1
sentinel failover-timeout incigold-master 180000
sentinel deny-scripts-reconfig yes

# Logging
logfile /var/log/redis/sentinel.log
loglevel notice

# Security
sentinel auth-user incigold-master default
sentinel auth-pass incigold-master your_redis_password_here

# Notification Scripts
sentinel notification-script incigold-master /etc/redis/notify.sh
sentinel client-reconfig-script incigold-master /etc/redis/reconfig.sh

# Advanced Configuration
sentinel resolve-hostnames no
sentinel announce-hostnames no
sentinel announce-ip 127.0.0.1
sentinel announce-port 26379
