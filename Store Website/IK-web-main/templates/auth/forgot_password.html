{% extends "base.html" %}
{% block title %}Şifremi Unuttum - İnci Gold{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Şifremi Unuttum</h2>
            <p>E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim</p>
        </div>
        
        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <input type="email" id="email" name="email" required 
                       value="{{ request.form.email or '' }}"
                       class="form-control" placeholder="E-posta adresinizi girin">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                Şifre Sıfırlama Bağlantısı Gönder
            </button>
        </form>
        
        <div class="auth-links">
            <p>
                <a href="{{ url_for('auth.login') }}">Giriş sayfasına dön</a>
            </p>
            <p>
                Hesabınız yok mu? 
                <a href="{{ url_for('auth.register') }}"> Kayıt olun</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
