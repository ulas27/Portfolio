{% extends "base.html" %}
{% block title %}Şifre Sıfırla - İnci Gold{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Yeni Şifre Belirle</h2>
            <p>Yeni şifrenizi girin</p>
        </div>
        
        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="password">Yeni Şifre</label>
                <input type="password" id="password" name="password" required 
                       class="form-control" placeholder="En az 6 karakter">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Şifre Tekrar</label>
                <input type="password" id="confirm_password" name="confirm_password" required 
                       class="form-control" placeholder="Şifrenizi tekrar girin">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                Şifreyi Güncelle
            </button>
        </form>
        
        <div class="auth-links">
            <p>
                <a href="{{ url_for('auth.login') }}">Giriş sayfasına dön</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
