{% extends "base.html" %}
{% block title %}Şifre Değiştir - İnci Gold{% endblock %}
{% block content %}
<div class="container" style="padding: 2rem 0; max-width: 600px;">
  <h1>Şifre Değiştir</h1>
  <form method="POST" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label for="current_password">Mevcut Şifre</label>
      <input id="current_password" name="current_password" class="form-control" type="password" required>
    </div>

    <div class="form-group">
      <label for="new_password">Yeni Şifre</label>
      <input id="new_password" name="new_password" class="form-control" type="password" required>
    </div>

    <div class="form-group">
      <label for="new_password_confirm">Yeni Şifre (Tekrar)</label>
      <input id="new_password_confirm" name="new_password_confirm" class="form-control" type="password" required>
    </div>

    <div style="display:flex; gap:.75rem; margin-top:1rem;">
      <button type="submit" class="btn btn-primary">Şifreyi Güncelle</button>
      <a href="{{ url_for('auth.profile') }}" class="btn btn-outline">Vazgeç</a>
    </div>
  </form>
</div>
{% endblock %}
