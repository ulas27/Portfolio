<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ newsletter_subject }}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .email-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 300;
        }
        .content {
            padding: 30px;
        }
        .newsletter-title {
            color: #d4af37;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .newsletter-content {
            line-height: 1.8;
        }
        .newsletter-content h1, .newsletter-content h2, .newsletter-content h3 {
            color: #d4af37;
        }
        .newsletter-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 15px 0;
        }
        .cta-button {
            display: inline-block;
            background: #d4af37;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
            font-weight: 600;
        }
        .footer {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }
        .footer a {
            color: #d4af37;
            text-decoration: none;
        }
        .unsubscribe {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #666;
        }
        .unsubscribe a {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>İnci Gold</h1>
        </div>
        
        <div class="content">
            <div class="newsletter-title">{{ newsletter_subject }}</div>
            
            <div class="newsletter-content">
                {{ newsletter_content|safe }}
            </div>
            
            <div style="text-align: center; margin: 30px 0;">
                <a href="{{ url_for('shop.index', _external=True) }}" class="cta-button">
                    Mağazayı Ziyaret Et
                </a>
            </div>
        </div>
        
        <div class="footer">
            <p>İnci Gold - Lüks Mücevher Koleksiyonu</p>
            <p>Kuyumcular Çarşısı, İstanbul | +90 212 555 0123</p>
            
            <div class="unsubscribe">
                <p>Bu emaili almak istemiyorsanız <a href="{{ url_for('newsletter.unsubscribe', token=subscriber.unsubscribe_token, _external=True) }}">buraya tıklayarak</a> abonelikten çıkabilirsiniz.</p>
            </div>
        </div>
    </div>
</body>
</html>
